  <script id="aviator-splash-mode">
    (function () {
      const params = new URLSearchParams(window.location.search);
      const path = window.location.pathname || "";
      let savedRoute = "";
      try {
        savedRoute =
          window.localStorage.getItem("flutter.last_route") ||
          window.localStorage.getItem("last_route") ||
          "";
      } catch (error) {
        savedRoute = "";
      }
      const savedRouteLooksAviator =
        savedRoute.includes("/aviator") ||
        (
          savedRoute.includes("operator=") &&
          savedRoute.includes("token=")
        );
      const isAviatorLaunch =
        path === "/aviator" ||
        savedRouteLooksAviator ||
        (
          params.has("operator") &&
          params.has("user") &&
          params.has("token")
        );
      window.__kessAviatorLaunch = isAviatorLaunch;
      if (isAviatorLaunch) {
        document.documentElement.classList.add("aviator-launch");
      }
    })();
  </script>

  <script id="xhr-response-text-guard">
    (function () {
      const proto = window.XMLHttpRequest && window.XMLHttpRequest.prototype;
      if (!proto) return;

      const descriptor = Object.getOwnPropertyDescriptor(proto, "responseText");
      if (
        !descriptor ||
        typeof descriptor.get !== "function" ||
        descriptor.configurable === false
      ) {
        return;
      }

      Object.defineProperty(proto, "responseText", {
        configurable: true,
        enumerable: descriptor.enumerable,
        get: function () {
          try {
            return descriptor.get.call(this);
          } catch (error) {
            const responseType = this.responseType;
            if (responseType && responseType !== "text") {
              return "";
            }
            throw error;
          }
        },
      });
    })();
  </script>
  <script id="splash-screen-script">
    window.__kessBoot = window.__kessBoot || {};
    let startupLogEnabled = window.location.search.includes('startupLog=1');
    try {
      startupLogEnabled =
        startupLogEnabled || window.localStorage.getItem('startupLog') === '1';
    } catch (error) {
      startupLogEnabled = startupLogEnabled;
    }
    window.__kessBoot.enableStartupLog = startupLogEnabled;
    window.__kessBoot.startupLog = function (message) {
      if (window.__kessBoot.enableStartupLog) {
        console.log(message);
      }
    };
    window.__kessBoot.splashVisibleAt = performance.now();
    window.__kessBoot.startupLog("[startup] splash_visible at " + window.__kessBoot.splashVisibleAt.toFixed(1) + "ms");

    const navEntries = performance.getEntriesByType("navigation");
    if (navEntries && navEntries.length > 0) {
      const nav = navEntries[0];
      window.__kessBoot.startupLog("[startup] nav_response_start at " + nav.responseStart.toFixed(1) + "ms");
      window.__kessBoot.startupLog("[startup] nav_dom_content_loaded at " + nav.domContentLoadedEventEnd.toFixed(1) + "ms");
      window.__kessBoot.startupLog("[startup] nav_load_event_end at " + nav.loadEventEnd.toFixed(1) + "ms");
    }

    window.__aviatorSplashRelease = false;
    window.__aviatorSplashRemovalPending = false;

    window.shouldHoldAviatorSplash = function () {
      return (
        window.__kessAviatorLaunch === true ||
        document.documentElement.classList.contains("aviator-launch")
      ) &&
        window.__aviatorSplashRelease !== true;
    };

    window.removeSplashFromWeb = function () {
      if (window.shouldHoldAviatorSplash()) {
        window.__aviatorSplashRemovalPending = true;
        window.__kessBoot.startupLog("[startup] aviator_splash_hold at " + performance.now().toFixed(1) + "ms");
        return;
      }
      const now = performance.now();
      window.__kessBoot.startupLog("[startup] splash_removed at " + now.toFixed(1) + "ms");
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    };

    window.addEventListener("aviator-app-ready", function () {
      window.__aviatorSplashRelease = true;
      window.__kessBoot.startupLog("[startup] aviator_app_ready at " + performance.now().toFixed(1) + "ms");
      window.removeSplashFromWeb();
    });
  </script>
